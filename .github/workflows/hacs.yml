name: HACS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hacs:
    name: Run HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run HACS validation action
        uses: hacs/action@main
        with:
          category: "integration"
